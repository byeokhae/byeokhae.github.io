<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>byeokhae's Profile</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4a90e2;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .profile-emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            font-weight: 700;
        }
        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }
        .info-section {
            text-align: left;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .info-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .info-list li {
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .info-list li strong {
            display: inline-block;
            width: 80px;
            color: #555;
        }
        .links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background-color: #f1f3f5;
            color: #495057;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <!-- 상단 프로필 이모지 -->
        <div class="profile-emoji">✨</div>
        
        <!-- 이름 및 한줄소개 -->
        <h1>byeokhae</h1>
        <div class="subtitle">여기에 저를 소개하는 멋진 한 줄 문구를 적어주세요!</div>
        
        <!-- 상세 정보 섹션 -->
        <div class="info-section">
            <div class="info-title">About Me</div>
            <ul class="info-list">
                <li><strong>Like</strong> 🎨 창작하기, ☕ 커피, 🎧 음악 감상</li>
                <li><strong>Link</strong> 🔗 아래 버튼들을 눌러 이동해 보세요.</li>
                <li><strong>TMI</strong> 💬 여기에 쓰고 싶은 말들을 자유롭게 적어보세요.</li>
            </ul>
        </div>
        
        <!-- 바로가기 링크 버튼들 -->
        <div class="links">
            <a href="#" class="btn" target="_blank">📸 인스타그램</a>
            <a href="#" class="btn" target="_blank">📝 블로그 바로가기</a>
            <a href="#" class="btn" target="_blank">✉️ 방명록 / 연락처</a>
        </div>
    </div>
</div>

</body>
</html>
